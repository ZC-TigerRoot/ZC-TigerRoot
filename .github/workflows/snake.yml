name: Contribution snake

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # amber dots to match the header's accretion disk
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#c2410c&color_dots=#ebedf0,#fde7c7,#fbbf74,#f08a24,#c2410c
            dist/snake-dark.svg?palette=github-dark&color_snake=#fde68a&color_dots=#161b22,#3b2a12,#7c4a0e,#c2700c,#f59e0b

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
